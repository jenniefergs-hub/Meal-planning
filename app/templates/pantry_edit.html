{% extends "base.html" %}
{% from "_macros.html" import unit_field %}
{% block title %}Edit {{ item.name }}{% endblock %}
{% block content %}
<a href="/pantry" class="btn btn-secondary">&larr; Back to Pantry</a>
<h1>Edit ingredient</h1>

{% if error == "missing_name" %}<p class="error">Name is required.</p>{% endif %}

<form method="post" action="/pantry/{{ item.id }}/edit" class="add-recipe" style="display: block;">
  <label>Name <input type="text" name="name" value="{{ item.name }}" required></label>
  <label>Quantity <input type="text" name="quantity" value="{{ item.quantity or '' }}"></label>
  <div>
    <label style="display: block; margin-bottom: 0.25rem;">Unit</label>
    {{ unit_field("unit", item.unit) }}
  </div>
  <label>Category <input type="text" name="category" value="{{ item.category or '' }}"></label>
  <label>Expiry date <input type="date" name="expiry_date" value="{{ item.expiry_date.strftime('%Y-%m-%d') if item.expiry_date else '' }}"></label>
  <button type="submit">Save changes</button>
</form>
{% endblock %}
